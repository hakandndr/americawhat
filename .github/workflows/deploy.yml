name: Deploy to Hostinger (retired)

# The Hostinger FTP deploy is retired. AmericaWhat is deployed to Cloudflare by
# deploy-cloudflare.yml. This file keeps the workflow's name so that, once it
# reaches main, a push can no longer publish anything to Hostinger: there is
# no push trigger, no FTP step and no use of the FTP secrets.
#
# Rollback to Hostinger (docs/DEPLOYMENT.md, "Hostinger rollback") does NOT run
# this file: it re-runs the old workflow on the tag `hostinger-final`, which
# holds the last Hostinger-compatible source and the original deploy.yml.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-24.04
    steps:
      - name: Refuse
        run: |
          echo "::error::The Hostinger FTP deploy is retired. Use 'Deploy to Cloudflare', or the hostinger-final tag for a Hostinger rollback (docs/DEPLOYMENT.md)."
          exit 1
